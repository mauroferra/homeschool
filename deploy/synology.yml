# Synology Container Manager — create a Project and paste this file's contents.
# Supply a .env (project env) with JWT_SECRET, ADMIN_EMAIL, ADMIN_PASSWORD.
#
# First run on the NAS:
#   Create the folder /volume1/docker/homeschool/data, enable SSH, then:
#   sudo chown -R 1000:1000 /volume1/docker/homeschool/data
# (the container runs as non-root uid 1000 and needs to write SQLite there)
services:
  curriculum:
    image: ghcr.io/mauroferra/homeschool:latest
    container_name: homeschool-curriculum
    ports:
      - "4000:4000"
    environment:
      NODE_ENV: production
      JWT_SECRET: ${JWT_SECRET}
      ADMIN_EMAIL: ${ADMIN_EMAIL}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
    volumes:
      - /volume1/docker/homeschool/data:/app/backend/data
    restart: unless-stopped
