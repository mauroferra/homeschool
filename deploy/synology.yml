# Synology Container Manager — create a Project and paste this file's contents.
# Supply a .env (project env) with JWT_SECRET, ADMIN_EMAIL, ADMIN_PASSWORD
# (and optionally DB_NAME/DB_USER/DB_PASSWORD, defaulting to app/faro).
# Mirrors docker-compose.yml: same image, env, postgres and healthcheck.
services:
  app:
    image: docker.io/mauroferra/faro:latest
    container_name: faro-app
    ports:
      - "4000:4000"
    environment:
      NODE_ENV: production
      JWT_SECRET: ${JWT_SECRET:-change-this-in-production}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@faro.app}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-admin123}
      DB_DIALECT: postgres
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-faro}
      DB_USER: ${DB_USER:-app}
      DB_PASSWORD: ${DB_PASSWORD:-app}
    volumes:
      - faro-app-data:/app/backend/data
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  postgres:
    image: docker.io/library/postgres:16-alpine
    container_name: faro-postgres
    environment:
      POSTGRES_DB: ${DB_NAME:-faro}
      POSTGRES_USER: ${DB_USER:-app}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-app}
    volumes:
      - faro-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-app} -d ${DB_NAME:-faro}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped

volumes:
  faro-data:
  faro-postgres-data: