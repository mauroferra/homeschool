services:
  curriculum:
    image: ghcr.io/mauroferra/homeschool:latest
    build: .
    container_name: homeschool-curriculum
    ports:
      - "4000:4000"
    environment:
      NODE_ENV: production
      JWT_SECRET: ${JWT_SECRET:-change-this-in-production}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@homeschool.app}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-admin123}
      DB_DIALECT: postgres
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-homeschool}
      DB_USER: ${DB_USER:-app}
      DB_PASSWORD: ${DB_PASSWORD:-app}
    volumes:
      - curriculum-data:/app/backend/data
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  postgres:
    image: ghcr.io/eic/postgres:16-alpine
    container_name: homeschool-postgres
    environment:
      POSTGRES_DB: ${DB_NAME:-homeschool}
      POSTGRES_USER: ${DB_USER:-app}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-app}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-app} -d ${DB_NAME:-homeschool}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped

volumes:
  curriculum-data:
  postgres-data: